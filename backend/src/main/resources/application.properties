# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}

# ===============================
# POSTGRESQL 15 DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zeciakstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Wsla200414}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The 'update' mode will automatically create/update tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT (JSON WEB TOKENS) CONFIGURATION
# ===============================
# Clave secreta HMAC-SHA de al menos 256 bits para firma de tokens JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Duración del token en milisegundos (24 Horas = 86400000 ms)
jwt.expiration.ms=86400000
