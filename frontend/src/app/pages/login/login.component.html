<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Bienvenido de Vuelta</h2>
      <p>Ingresa a tu cuenta en ZeciaK Store</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched"
          placeholder="ejemplo@correo.com"
        >
        <div *ngIf="f['email'].invalid && f['email'].touched" class="error-message">
          <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="f['email'].errors?.['email']">Ingresa un formato de correo válido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
          placeholder="********"
        >
        <div *ngIf="f['password'].invalid && f['password'].touched" class="error-message">
          <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="f['password'].errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading">Cargando...</span>
        <span *ngIf="!isLoading">Iniciar Sesión</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
