name: OWASP ZAP Security Audit

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  # ========================================================
  # JOB 1: BACKEND UNIT TESTS (Rápido: feedback en < 1 min)
  # ========================================================
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        working-directory: backend
        run: mvn test -B

  # ========================================================
  # JOB 2: OWASP ZAP SCAN - BACKEND API (En paralelo)
  # ========================================================
  zap-backend:
    name: OWASP ZAP - Backend API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zeciakstore_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Spring Boot Backend
        working-directory: backend
        run: mvn package -DskipTests -B -T 1C

      - name: Start Spring Boot Backend in Background
        env:
          DB_URL: jdbc:postgresql://localhost:5432/zeciakstore_db
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password_123
          PORT: 8080
        run: |
          java -jar backend/target/*.jar > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for Backend API Readiness
        run: |
          echo "Verificando disponibilidad de la API Backend en http://localhost:8080/api/products..."
          timeout 120s bash -c 'until curl -sf http://localhost:8080/api/products > /dev/null; do
            echo "Esperando que el backend responda..."
            sleep 3
          done' || { echo "ERROR: El backend no inició correctamente. Logs:"; cat backend.log; exit 1; }
          echo "¡Backend en línea y respondiendo HTTP 200!"

      - name: Prepare Report Directory & Permissions
        run: |
          mkdir -p zap-backend-report
          chmod -R a+w zap-backend-report $(pwd)

      - name: Run OWASP ZAP Baseline Scan (Docker)
        run: |
          docker run --network="host" -v $(pwd)/zap-backend-report:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080/api/products \
            -r report_html.html \
            -w report_md.md \
            -J report_json.json \
            -I || true

      - name: Upload Backend ZAP Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-report
          path: zap-backend-report/
          if-no-files-found: warn

      - name: Upload Backend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-execution-log
          path: backend.log
          if-no-files-found: ignore

  # ========================================================
  # JOB 3: OWASP ZAP SCAN - FRONTEND SPA (En paralelo)
  # ========================================================
  zap-frontend:
    name: OWASP ZAP - Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Angular Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve Frontend in Background
        run: |
          npx --yes http-server frontend/dist/frontend/browser -p 4200 --cors > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for Frontend Readiness
        run: |
          echo "Verificando disponibilidad del Frontend en http://localhost:4200..."
          timeout 60s bash -c 'until curl -sf http://localhost:4200 > /dev/null; do
            echo "Esperando que el frontend responda..."
            sleep 2
          done' || { echo "ERROR: El frontend no inició correctamente. Logs:"; cat frontend.log; exit 1; }
          echo "¡Frontend en línea y respondiendo HTTP 200!"

      - name: Prepare Report Directory & Permissions
        run: |
          mkdir -p zap-frontend-report
          chmod -R a+w zap-frontend-report $(pwd)

      - name: Run OWASP ZAP Baseline Scan (Docker)
        run: |
          docker run --network="host" -v $(pwd)/zap-frontend-report:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:4200 \
            -r report_html.html \
            -w report_md.md \
            -J report_json.json \
            -I || true

      - name: Upload Frontend ZAP Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-frontend-report
          path: zap-frontend-report/
          if-no-files-found: warn

      - name: Upload Frontend Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-execution-log
          path: frontend.log
          if-no-files-found: ignore
